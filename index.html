<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aquila Genuss Ohne Grenzen | Hochheim</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --black:#0d0d0c;
    --cream:#f4efe5;
    --white:#fffdf8;
    --gold:#c6a15b;
    --gold2:#e0c37d;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; overflow-x:hidden; }
body{ width:100%; max-width:100%; overflow-x:hidden; background:var(--cream); color:var(--black); font-family:"DM Sans",sans-serif; }
img{ max-width:100%; display:block; }
button, input, textarea{ font:inherit; }
button{ cursor:pointer; }
a{ color:inherit; text-decoration:none; }
.container{ width:min(1180px,92%); margin:auto; }

header{ position:fixed; top:0; left:0; width:100%; z-index:1000; padding:18px 0; background:rgba(13,13,12,.9); backdrop-filter:blur(10px); }
.nav{ width:min(1180px,92%); margin:auto; display:flex; align-items:center; justify-content:space-between; }
.brand{ display:flex; align-items:center; gap:12px; color:white; }
.brand img{ width:90px; max-height:55px; object-fit:contain; }
.brandFallback{ font-family:"Cormorant Garamond",serif; font-size:32px; font-style:italic; color:var(--gold2); }
.navLinks{ display:flex; align-items:center; gap:30px; }
.navLinks a{ color:#fff; font-size:14px; font-weight:500; opacity:.88; }

.hero{ min-height:100svh; position:relative; display:flex; align-items:center; color:white; background: linear-gradient(90deg, rgba(5,5,4,.9) 0%, rgba(5,5,4,.6) 100%), url("https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=2200&q=90") center/cover; }
.heroContent{ position:relative; z-index:2; padding-top:90px; max-width:780px; }
.eyebrow{ color:var(--gold2); font-size:12px; letter-spacing:4px; text-transform:uppercase; margin-bottom:20px; }
.hero h1{ font-family:"Cormorant Garamond",serif; font-size:clamp(50px,8vw,110px); font-weight:500; line-height:.9; margin-bottom:25px; }
.hero h1 span{ display:block; font-size:clamp(16px,2vw,24px); letter-spacing:5px; font-family:"DM Sans",sans-serif; margin-top:15px; color:#eee8db; }
.heroText{ font-size:18px; line-height:1.7; color:rgba(255,255,255,.85); }
.heroButtons{ display:flex; gap:14px; margin-top:30px; }
.btn{ border:1px solid rgba(255,255,255,.2); padding:14px 24px; border-radius:100px; display:inline-flex; align-items:center; gap:10px; font-weight:600; font-size:14px; text-transform:uppercase; }
.btn.gold{ background:var(--gold); color:#111; border-color:var(--gold); }

section{ padding:90px 0; }
.menuSection{ background:#121210; color:white; }
.sectionHeader{ margin-bottom:40px; }
.sectionKicker{ color:var(--gold); letter-spacing:3px; text-transform:uppercase; font-size:12px; margin-bottom:8px; }
.sectionTitle{ font-family:"Cormorant Garamond",serif; font-size:clamp(36px,5vw,60px); }

.menuGrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:24px; }
.productCard{ overflow:hidden; border:1px solid rgba(255,255,255,.1); background:#191917; border-radius:18px; padding:20px; }
.productName{ font-family:"Cormorant Garamond",serif; font-size:26px; margin-bottom:6px; }
.productPrice{ color:var(--gold2); font-size:18px; font-weight:700; }

.galleryGrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:18px; }
.galleryItem{ height:260px; border-radius:16px; overflow:hidden; }
.galleryItem img{ width:100%; height:100%; object-fit:cover; }

/* Admin Modal */
.adminOpen{ position:fixed; right:20px; bottom:20px; z-index:1200; width:50px; height:50px; border-radius:50%; border:0; background:#171715; color:var(--gold); font-size:20px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
.modal{ position:fixed; inset:0; z-index:3000; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.85); backdrop-filter:blur(10px); }
.modal.show{ display:flex; }
.modalBox{ width:min(800px,96vw); max-height:90vh; overflow-y:auto; border-radius:20px; background:#171715; color:white; border:1px solid rgba(255,255,255,.12); padding:30px; }
.loginBox{ width:min(400px,94vw); }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12px; color:#aaa; margin-bottom:6px; text-transform:uppercase; }
.field input, .field textarea{ width:100%; border:1px solid rgba(255,255,255,.15); background:#0a0a09; color:white; border-radius:10px; padding:12px; outline:none; }
.adminBtn{ border:0; padding:12px 20px; border-radius:10px; background:var(--gold); color:#111; font-weight:700; margin-top:8px; }
</style>
</head>

<body>

<header>
    <nav class="nav">
        <a href="#start" class="brand">
            <img id="headerLogo" src="" alt="Aquila" style="display:none;">
            <span id="headerFallback" class="brandFallback">Aquila</span>
        </a>
        <div class="navLinks">
            <a href="#start">Startseite</a>
            <a href="#menu">Speisekarte</a>
            <a href="#galerie">Galerie</a>
        </div>
    </nav>
</header>

<main>
<section class="hero" id="start">
    <div class="container">
        <div class="heroContent">
            <div class="eyebrow">Hochheim am Main</div>
            <h1 id="heroTitle">Aquila<span id="heroSlogan">GENUSS OHNE GRENZEN</span></h1>
            <p class="heroText" id="heroText">Neapolitanische Pizzeria & Bar – italienischer Genuss in Hochheim am Main.</p>
            <div class="heroButtons">
                <a class="btn gold" href="#menu">Speisekarte</a>
            </div>
        </div>
    </div>
</section>

<section class="menuSection" id="menu">
    <div class="container">
        <div class="sectionHeader">
            <div class="sectionKicker">La nostra cucina</div>
            <h2 class="sectionTitle">Unsere Speisekarte</h2>
        </div>
        <div id="menuGrid" class="menuGrid"></div>
    </div>
</section>

<section id="galerie">
    <div class="container">
        <div class="sectionHeader">
            <div class="sectionKicker">Atmosphäre</div>
            <h2 class="sectionTitle">Galerie</h2>
        </div>
        <div id="galleryGrid" class="galleryGrid"></div>
    </div>
</section>
</main>

<button class="adminOpen" id="adminOpen"><i class="fa-solid fa-gear"></i></button>

<div class="modal" id="adminModal">
    <div class="modalBox loginBox" id="loginBox">
        <h2 style="text-align:center; margin-bottom:20px;">Admin Login</h2>
        <form id="loginForm">
            <div class="field">
                <label>Passwort</label>
                <input id="adminPassword" type="password" required>
            </div>
            <button class="adminBtn" type="submit" style="width:100%;">Einloggen</button>
        </form>
    </div>

    <div class="modalBox" id="adminDashboard" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>Admin Dashboard</h2>
            <button id="closeAdmin" style="background:none; border:0; color:white; font-size:24px;">×</button>
        </div>

        <div class="field">
            <label>Restaurant Name</label>
            <input id="editName" value="Aquila Genuss Ohne Grenzen">
        </div>
        <div class="field">
            <label>Slogan</label>
            <input id="editSlogan" value="GENUSS OHNE GRENZEN">
        </div>
        <div class="field">
            <label>Hero Text</label>
            <textarea id="editHeroText">Neapolitanische Pizzeria & Bar – italienischer Genuss in Hochheim am Main.</textarea>
        </div>
        <button class="adminBtn" id="saveGeneral">Texte Speichern</button>

        <hr style="margin:25px 0; border-color:rgba(255,255,255,.1);">

        <h3>Logo Hochladen</h3>
        <div class="field" style="margin-top:10px;">
            <input id="logoFile" type="file" accept="image/*">
        </div>
        <button class="adminBtn" id="uploadLogoBtn">Logo Speichern</button>

        <div style="margin-top:30px; text-align:right;">
            <button class="adminBtn" id="logoutBtn" style="background:#8e2929; color:white;">Ausloggen</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCWCe2qx-a5GL9M9EFo4Tu28CcbHagv_ps",
    authDomain: "aquila-genuss-hochheim.firebaseapp.com",
    projectId: "aquila-genuss-hochheim",
    storageBucket: "aquila-genuss-hochheim.firebasestorage.app",
    messagingSenderId: "674162463710",
    appId: "1:674162463710:web:e91d6edc997a9eee69834f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ADMIN_PASSWORD = "3636";

const fileToDataURL = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
});

async function loadWebsite() {
    try {
        const snap = await getDoc(doc(db, "settings", "site"));
        if (snap.exists()) {
            const data = snap.data();
            if(data.restaurantName) document.getElementById("heroTitle").childNodes[0].nodeValue = data.restaurantName + " ";
            if(data.slogan) document.getElementById("heroSlogan").textContent = data.slogan;
            if(data.heroText) document.getElementById("heroText").textContent = data.heroText;
            
            if (data.logoUrl) {
                const logo = document.getElementById("headerLogo");
                logo.src = data.logoUrl;
                logo.style.display = "block";
                document.getElementById("headerFallback").style.display = "none";
            }
        }
    } catch(e) { console.error(e); }
}

document.getElementById("uploadLogoBtn").addEventListener("click", async () => {
    const file = document.getElementById("logoFile").files[0];
    if(!file) return alert("Bitte Datei auswählen!");
    try {
        const base64Url = await fileToDataURL(file);
        await setDoc(doc(db, "settings", "site"), { logoUrl: base64Url }, { merge: true });
        alert("Logo erfolgreich gespeichert!");
        loadWebsite();
    } catch(e) {
        alert("Fehler beim Hochladen!");
    }
});

document.getElementById("saveGeneral").addEventListener("click", async () => {
    await setDoc(doc(db, "settings", "site"), {
        restaurantName: document.getElementById("editName").value,
        slogan: document.getElementById("editSlogan").value,
        heroText: document.getElementById("editHeroText").value
    }, { merge: true });
    alert("Texte gespeichert!");
    loadWebsite();
});

document.getElementById("adminOpen").onclick = () => document.getElementById("adminModal").classList.add("show");
document.getElementById("closeAdmin").onclick = () => document.getElementById("adminModal").classList.remove("show");
document.getElementById("loginForm").onsubmit = (e) => {
    e.preventDefault();
    if(document.getElementById("adminPassword").value === ADMIN_PASSWORD) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
    } else alert("Falsches Passwort!");
};
document.getElementById("logoutBtn").onclick = () => {
    document.getElementById("adminDashboard").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("adminModal").classList.remove("show");
};

loadWebsite();
</script>
</body>
</html>
